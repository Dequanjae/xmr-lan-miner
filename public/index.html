<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XMR LAN Miner</title>
<style>
  * { box-sizing: border-box; font-family: ui-monospace, Menlo, monospace; }
  body { background: #0a0a0a; color: #d0d0d0; margin: 0; padding: 2rem; }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { color: #ff6600; letter-spacing: 2px; }
  .head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 1rem; margin-bottom: 1.5rem; }
  .head a { color: #888; text-decoration: none; font-size: 13px; }
  .head a:hover { color: #ff6600; }
  input, button {
    background: #1a1a1a; border: 1px solid #333; color: #e0e0e0;
    padding: 0.6rem 0.9rem; width: 100%; margin-bottom: 0.6rem;
    font-size: 14px; border-radius: 4px;
  }
  button { background: #ff6600; color: #000; font-weight: bold; cursor: pointer; border: none; }
  button:hover { background: #ff8833; }
  label { color: #888; font-size: 12px; display: block; margin-bottom: 0.3rem; margin-top: 0.6rem; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.75rem; margin-bottom: 1rem; }
  .stat { background: #111; border: 1px solid #222; padding: 0.75rem; border-radius: 4px; }
  .label { color: #888; font-size: 11px; text-transform: uppercase; }
  .value { font-size: 22px; font-weight: bold; margin-top: 0.25rem; }
  .hashrate { color: #4caf50; }
  .shares { color: #2196f3; }
  .wallet-box { background: #111; border: 1px solid #222; padding: 0.5rem; font-size: 11px; word-break: break-all; color: #888; margin-bottom: 1rem; border-radius: 4px; }
  .log-box { background: #050505; border: 1px solid #222; padding: 0.75rem; height: 300px; overflow-y: auto; font-size: 12px; border-radius: 4px; }
  .log-box div { margin: 2px 0; }
  .ok { color: #4caf50; }
  .err { color: #e74c3c; }
  .hidden { display: none; }
  .sys-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 0.5rem; margin-bottom: 1rem; }
  .sys-item { background: #111; border: 1px solid #222; padding: 0.5rem; border-radius: 4px; text-align: center; }
  .sys-item .label { font-size: 10px; }
  .sys-item .value { font-size: 16px; }
  .worker-control { background: #111; border: 1px solid #222; padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem; }
  .worker-control label { display: inline; }
  input[type="range"] { width: 100%; margin: 0.5rem 0; }
  .checkbox-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.6rem; }
  .checkbox-row input { width: auto; margin: 0; }
  .checkbox-row label { margin: 0; cursor: pointer; }
  .row { display: flex; gap: 0.5rem; align-items: center; }
  .row button { width: auto; margin: 0; }
  .jit-badge { background: #0d4429; color: #4caf50; padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: bold; }
  .auto-note { font-size: 11px; color: #666; margin-top: 0.3rem; }
</style>
</head>
<body>
<div class="container">
  <div class="head">
    <h1>[ XMR LAN MINER ]</h1>
    <div><span id="status">Disconnected</span> <span class="jit-badge">JIT</span> &nbsp; <a href="/admin">Admin →</a></div>
  </div>

  <div class="sys-grid">
    <div class="sys-item"><div class="label">CPU Cores</div><div class="value" id="sysCores">—</div></div>
    <div class="sys-item"><div class="label">Engine</div><div class="value" id="sysMode" style="font-size:14px;color:#4caf50">JIT</div></div>
    <div class="sys-item"><div class="label">Browser</div><div class="value" id="sysBrowser">—</div></div>
    <div class="sys-item"><div class="label">OS</div><div class="value" id="sysOS">—</div></div>
  </div>

  <div id="setup">
    <label>Monero wallet</label>
    <input id="walletInput" placeholder="44... or 8...">
    <label>Pool host</label>
    <input id="poolHost" value="pool.supportxmr.com">
    <label>Pool port</label>
    <input id="poolPort" type="number" value="3333">

    <div class="worker-control">
      <label>Worker threads: <strong id="workerCountDisplay">4</strong> (max: <span id="maxCores">—</span>)</label>
      <input type="range" id="workerCount" min="1" max="8" value="4" oninput="updateWorkerCount(this.value)">
      <div style="font-size:11px;color:#888">More threads = more hashrate. Max = your CPU core count.</div>
    </div>

    <div class="checkbox-row">
      <input type="checkbox" id="backgroundMode">
      <label for="backgroundMode">Background mode (fewer threads, longer pauses — keeps browser smooth for other tabs)</label>
    </div>

    <button onclick="startMining()">[ Start Mining ]</button>
    <div class="auto-note">Wallet + settings are saved. Next time you open this page, mining auto-starts.</div>
  </div>

  <div id="mining" class="hidden">
    <div class="stat-grid">
      <div class="stat"><div class="label">Hashrate</div><div class="value hashrate" id="hashrate">0 H/s</div></div>
      <div class="stat"><div class="label">Accepted</div><div class="value shares" id="accepted">0</div></div>
      <div class="stat"><div class="label">Rejected</div><div class="value" id="rejected" style="color:#e74c3c;">0</div></div>
      <div class="stat"><div class="label">Threads</div><div class="value" id="activeThreads" style="font-size:18px;">0</div></div>
      <div class="stat"><div class="label">Status</div><div class="value" id="miningStatus" style="font-size:14px;color:#888;">idle</div></div>
    </div>
    <div class="wallet-box" id="walletDisplay">—</div>
    <div class="row" style="margin-bottom:1rem;">
      <button onclick="stopMining()" style="background:#444;color:#fff;">[ Stop Mining ]</button>
    </div>
    <div class="log-box" id="logBox"></div>
  </div>
</div>
<script src="miner.js"></script>
</body>
</html>
