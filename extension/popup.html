<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; font-family: ui-monospace, Menlo, monospace; margin: 0; padding: 0; }
  body { width: 280px; background: #0a0a0a; color: #d0d0d0; padding: 12px; }
  h1 { font-size: 14px; color: #ff6600; margin-bottom: 10px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .stat { background: #111; border: 1px solid #222; padding: 8px; border-radius: 4px; }
  .stat .label { font-size: 10px; color: #666; text-transform: uppercase; }
  .stat .value { font-size: 18px; font-weight: bold; margin-top: 2px; }
  .hashrate { color: #4caf50; }
  .accepted { color: #2196f3; }
  .rejected { color: #e74c3c; }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  .dot-green { background: #4caf50; }
  .dot-red { background: #e74c3c; }
  .dot-gray { background: #666; }
  .btn { width: 100%; padding: 8px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; margin-bottom: 6px; }
  .btn-start { background: #ff6600; color: #000; }
  .btn-stop { background: #333; color: #fff; }
  .settings { margin-top: 8px; }
  .settings label { font-size: 11px; color: #888; display: block; margin-top: 6px; margin-bottom: 2px; }
  .settings input { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #e0e0e0; padding: 6px; border-radius: 4px; font-size: 12px; }
  .settings input[type="number"] { width: 80px; }
  .status-bar { font-size: 11px; color: #888; margin-bottom: 10px; }
</style>
</head>
<body>
<h1>[ XMR LAN MINER ]</h1>
<div class="status-bar">
  <span class="status-dot dot-gray" id="statusDot"></span>
  <span id="statusText">Idle</span>
</div>
<div class="stats">
  <div class="stat"><div class="label">Hashrate</div><div class="value hashrate" id="hashrate">0 H/s</div></div>
  <div class="stat"><div class="label">Threads</div><div class="value" id="threads">0</div></div>
  <div class="stat"><div class="label">Accepted</div><div class="value accepted" id="accepted">0</div></div>
  <div class="stat"><div class="label">Rejected</div><div class="value rejected" id="rejected">0</div></div>
</div>
<button class="btn btn-start" id="startBtn">▶ Start Mining</button>
<button class="btn btn-stop" id="stopBtn">■ Stop</button>
<div class="settings">
  <label>NAS URL</label>
  <input id="nasUrl" placeholder="ws://192.168.50.235:8088" value="ws://192.168.50.235:8088">
  <label>Wallet</label>
  <input id="wallet" placeholder="8ApdEka...">
  <label>Worker threads: <span id="workerDisplay">8</span></label>
  <input type="range" id="workerSlider" min="1" max="12" value="8" style="width:100%">
  <label><input type="checkbox" id="autoStart" checked> Auto-start on browser launch</label>
</div>
<script src="popup.js"></script>
</body>
</html>
